<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Job Tracker Project| Rejected</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <style>
          body {
        font-family: 'Inter', sans-serif;
        }
        </style>
</head>
<body class="bg-[#F8FAFC]">
     <section class=" hero w-[70%] mx-auto mt-20 border-b border-gray-300 mb-10">
        <h1 class="text-3xl text-[#002C5C] font-bold" >Job Application Tracker</h1>
        <div class="card-hero flex items-center justify-between my-10 ">
            <div id="total" class="p-6 bg-white w-[32%] rounded-2xl space-y-2 shadow">
                 <h4>Total</h4>
                 <p class="font-bold text-2xl">8</p>
                </div>
            <div id="interview" class="p-6 bg-white w-[32%] rounded-2xl space-y-2 shadow">
                 <h4>Interview</h4>
                 <p class="font-bold text-2xl text-[#10B981]">0</p>
                </div>
            <div id="rejected" class="p-6 bg-white w-[32%] rounded-2xl space-y-2 shadow">
                 <h4>Rejected</h4>
                 <p class="font-bold text-2xl text-red-600"> 0</p>
                </div>
                
        </div>
    </section>
     <section class="second-sec w-[70%] mx-auto mb-6">
        <div class="flex items-center mb-7 justify-between">
            <h2 class="text-xl text-[#002C5C] font-bold ">Available Jobs</h2>
            <p class="text-gray-600">8 jobs</p>
        </div>
        <div class="tab flex gap-2 items-center ">
           <a href="index.html" class="inline-block py-1 px-4 bg-blue-500 text-white font-medium rounded-lg transition">
        All
    </a>

    <a href="interview.html" class="inline-block py-1 px-4 bg-white border border-gray-200 text-gray-600 font-medium rounded-lg hover:bg-gray-50 transition">
        Interview
    </a>

    <a href="rejected.html" class="inline-block py-1 px-4 bg-white border border-gray-200 text-gray-600 font-medium rounded-lg hover:bg-gray-50 transition">
        Rejected
    </a>
        </div>

      </section>

      <section class="interview-section w-[70%] mx-auto py-30 my-10 bg-white shadow rounded-2xl space-y-2">
        <img class="mx-auto" src="jobs.png" alt="jobs">
        <h2 class="text-2xl font-bold text-[#002C5C] text-center">No jobs available</h2>
        <p class="text-[#64748B] text-[16px] text-center">Check back soon for new job opportunities</p>

    </section>

    
</body >
</html>
